name: skyradar

x-skyradar-runtime-image: &skyradar-runtime-image
  image: ${SKYRADAR_IMAGE:-skyradar:latest}
  pull_policy: never

x-skyradar-build-image: &skyradar-build-image
  <<: *skyradar-runtime-image
  pull_policy: build
  build:
    context: .
    dockerfile: Dockerfile
    args:
      NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmmirror.com}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}

x-skyradar-environment: &skyradar-environment
  MONGODB_URI: mongodb://mongo:27017
  REDIS_HOST: redis
  REDIS_PORT: "6379"

x-skyradar-nginx-healthcheck-test: &skyradar-nginx-healthcheck-test
  - CMD-SHELL
  - >
    case "$${SKYRADAR_BASIC_AUTH_ENABLED:-true}" in
      0|false|False|FALSE|no|No|NO|off|Off|OFF)
        curl -fsS http://127.0.0.1/api/v1/health >/dev/null
        ;;
      *)
        credentials=/etc/nginx/.skyradar_basic_auth_credentials;
        username="$${SKYRADAR_BASIC_AUTH_USERNAME:-}";
        password="$${SKYRADAR_BASIC_AUTH_PASSWORD:-}";
        if { [ -z "$$username" ] || [ -z "$$password" ]; } && [ -r "$$credentials" ]; then
          username="$$(sed -n '1p' "$$credentials")";
          password="$$(sed -n '2p' "$$credentials")";
        fi;
        [ -n "$$username" ] && [ -n "$$password" ] &&
          curl -fsS -u "$$username:$$password" http://127.0.0.1/api/v1/health >/dev/null
        ;;
    esac || exit 1

services:
  skyradar:
    <<: *skyradar-build-image
    expose:
      - "8888"
    environment:
      <<: *skyradar-environment
      SKYRADAR_ROLE: web
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8888/api/v1/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  nginx:
    <<: *skyradar-runtime-image
    ports:
      - "${SKYRADAR_HTTP_PORT:-80}:80"
    environment:
      SKYRADAR_ROLE: nginx
      SKYRADAR_NGINX_UPSTREAM: skyradar:8888
      SKYRADAR_BASIC_AUTH_ENABLED: ${SKYRADAR_BASIC_AUTH_ENABLED:-true}
      SKYRADAR_BASIC_AUTH_USERNAME: ${SKYRADAR_BASIC_AUTH_USERNAME:-}
      SKYRADAR_BASIC_AUTH_PASSWORD: ${SKYRADAR_BASIC_AUTH_PASSWORD:-}
    depends_on:
      skyradar:
        condition: service_healthy
    healthcheck:
      test: *skyradar-nginx-healthcheck-test
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  worker:
    <<: *skyradar-runtime-image
    environment:
      <<: *skyradar-environment
      SKYRADAR_ROLE: worker
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "supervisorctl status huey | grep -q RUNNING && python -c \"from core.database import client, result_cache; client.admin.command('ping'); result_cache.ping()\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  redis:
    <<: *skyradar-runtime-image
    command: ["redis-server", "--save", "", "--appendonly", "no", "--protected-mode", "no"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  skyradar-all-in-one:
    <<: *skyradar-build-image
    profiles:
      - all-in-one
    ports:
      - "${SKYRADAR_ALL_IN_ONE_HTTP_PORT:-80}:80"
    environment:
      MONGODB_URI: mongodb://mongo:27017
      SKYRADAR_ROLE: all
      SKYRADAR_BASIC_AUTH_ENABLED: ${SKYRADAR_BASIC_AUTH_ENABLED:-true}
      SKYRADAR_BASIC_AUTH_USERNAME: ${SKYRADAR_BASIC_AUTH_USERNAME:-}
      SKYRADAR_BASIC_AUTH_PASSWORD: ${SKYRADAR_BASIC_AUTH_PASSWORD:-}
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: *skyradar-nginx-healthcheck-test
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  mongo:
    image: ${SKYRADAR_MONGO_IMAGE:-mongo:8.2.7}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "(mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' || mongo --quiet --eval 'db.runCommand({ ping: 1 }).ok') | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  mongo-data:
